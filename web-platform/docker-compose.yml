version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: luna_postgres
    environment:
      POSTGRES_DB: luna_ice_mapper
      POSTGRES_USER: luna_admin
      POSTGRES_PASSWORD: luna_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: luna_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luna_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://luna_admin:luna_password_2026@postgres:5432/luna_ice_mapper
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luna_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
